# ---- Hard rules: applied in code, not by the AI ----
rules:
  remote_only: true                         # skip on-site and hybrid roles
  must_be_open_to_malaysia: true            # skip "Remote - USA only" etc.
  skip_if_years_required_at_least: 2        # "2+ years" or more is skipped; "1-3 years" is kept
  allowed_required_languages: [English, Chinese]   # roles requiring Malay or others are skipped
  skip_for_missing_degree: false            # never skip for a degree; just noted
  screen_post_languages: [en, zh]           # only English and Chinese posts are screened
